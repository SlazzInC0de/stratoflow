name: StratoFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      - name: Run tests with coverage
        shell: bash
        env:
          DISABLE_PANDERA_IMPORT_WARNING: "True"
        run: |
          pytest -v --cov=function_app --cov=schemas --cov=scripts.split_valid_invalid --cov-report=term-missing | tee pytest-output.txt

      - name: Measure storage formats
        shell: bash
        run: python scripts/measure_storage.py | tee storage-output.txt

      - name: Publish results to job summary
        if: always()
        run: |
          {
            echo "## Coverage"; echo '```'; sed -n '/coverage:/,/TOTAL/p' pytest-output.txt; echo '```'
            echo "## Storage comparison"; cat storage-output.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  terraform-validate:
    name: Terraform Validate & Format
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (no backend, validate only)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate